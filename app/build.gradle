plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def releaseRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains("release")
}
if (releaseRequested && !keystorePropertiesFile.exists()) {
    throw new GradleException("Release signing is not configured: missing keystore.properties")
}

android {
    namespace 'com.calmnote.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.calmnote.app"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "0.5.4"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
