plugins {
    id 'com.android.application'
}

android {
    namespace 'com.calmnote.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.calmnote.app"
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "0.5.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
